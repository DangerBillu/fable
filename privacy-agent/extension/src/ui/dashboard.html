<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FABLE Copilot</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="fable-chat-app">
      <!-- Chatbot Header -->
      <header class="chat-header">
        <div class="header-left">
          <div class="bot-avatar">F</div>
          <div class="header-info">
            <h2>FABLE <span class="badge-copilot">COPILOT</span></h2>
            <div class="status-indicator">
              <span class="status-dot" id="status-dot"></span>
              <span id="agent-status-text">Shield Active &amp; Ready</span>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-clear-chat" title="Clear conversation" class="icon-btn">&#x1f5d1;</button>
        </div>
      </header>

      <!-- Privacy Shield Bar -->
      <div class="shield-status-bar">
        <div class="shield-chip">
          <span>&#x1f6e1; Redacted: <strong id="stat-redacted">0</strong></span>
        </div>
        <div class="shield-chip">
          <span>Blurred: <strong id="stat-faces">0</strong></span>
        </div>
        <div class="shield-chip">
          <span>Actions: <strong id="stat-approved">0</strong></span>
        </div>
      </div>

      <!-- Chat Messages Container -->
      <div id="chat-messages" class="chat-messages">
        <div class="msg-row bot-row">
          <div class="msg-avatar">F</div>
          <div class="msg-bubble bot-bubble">
            <p><strong>Hello! I'm FABLE</strong> &#x2014; your privacy-first browser copilot.</p>
            <p>I can click buttons, fill forms, navigate pages, and dispatch mission reports. Tell me what to do!</p>
            <div class="quick-chips">
              <button class="chip" data-prompt="Click the stage separation button">&#x1f680; Stage Separation</button>
              <button class="chip" data-prompt="Click the send telemetry report button">&#x1f4e7; Send Report</button>
              <button class="chip" data-prompt="Click the gimbal recalibration button">&#x1f4d0; Gimbal Recal</button>
              <button class="chip" data-prompt="Scroll down on this page">&#x2b07; Scroll Down</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Action Banner -->
      <div id="live-action-banner" class="live-action-banner" style="display: none;">
        <span class="spinner"></span>
        <span id="action-banner-text">Executing action on webpage...</span>
      </div>

      <!-- Chat Input Area -->
      <footer class="chat-footer">
        <div id="chat-form" class="chat-input-form">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Tell FABLE what to do on this page..."
            autocomplete="off"
          ></textarea>
          <button type="button" id="btn-send" class="btn-send" title="Send Directive">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
          <button type="button" id="btn-stop" class="btn-stop" title="Stop Agent" style="display: none;">
            &#x23f9;
          </button>
        </div>
      </footer>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
